name: Generate Recommendations

on:
  workflow_run:
    workflows: ["Update AI News Snapshot"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: generate-recommendations-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  recommend:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyyaml

      - name: Persona scoring
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          DEEPSEEK_API_BASE_URL: ${{ vars.DEEPSEEK_API_BASE_URL }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
        run: python scripts/persona_score.py --data-dir data

      - name: Generate topic recommendations
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          BACKUP_API_KEY: ${{ secrets.BACKUP_API_KEY }}
          BACKUP_API_BASE_URL: ${{ vars.BACKUP_API_BASE_URL }}
          BACKUP_MODEL: ${{ vars.BACKUP_MODEL }}
        run: python scripts/recommend_topics.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update persona scores and recommendations"
          for attempt in 1 2 3; do
            git push && exit 0
            echo "push rejected (attempt $attempt), rebasing..."
            git pull --rebase origin "${GITHUB_REF_NAME}" || { git rebase --abort || true; exit 1; }
          done
          git push
